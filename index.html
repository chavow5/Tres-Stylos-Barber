<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tres Stylos</title>
  <meta name="application-name" content="Tres Stylos">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tres Stylos">
  <meta name="theme-color" content="#141516" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#eceae6" media="(prefers-color-scheme: light)">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/img/icon-192.png">
  <link rel="shortcut icon" href="/assets/img/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/views.css">
</head>
<body>
  <main id="lg-root">
    <canvas id="bg-canvas" aria-hidden="true"></canvas>

    <!-- Pantalla de acceso (Login) -->
    <div class="card lg-panel login-card" id="login-card" data-lg="card" hidden>
      <div class="login-head">
        <img src="assets/img/icon-192.png" alt="Tres Stylos" class="login-logo">
        <h1>Tres Stylos</h1>
        <p>Ingresá con tu usuario y contraseña</p>
      </div>
      <form id="login-form" novalidate>
        <div class="f">
          <label for="login-user">Usuario</label>
          <input id="login-user" autocomplete="username" autocapitalize="none">
        </div>
        <div class="f">
          <label for="login-pass">Contraseña</label>
          <input id="login-pass" type="password" inputmode="numeric" autocomplete="current-password">
        </div>
        <p class="err" id="login-err"></p>
        <button type="submit" class="save" id="login-btn">Ingresar</button>
      </form>
    </div>

    <header class="brand-bar" data-app hidden>
      <div class="brand">
        <img src="assets/img/icon-192.png" alt="Tres Stylos" class="brand-logo">
        <span class="brand-name">Tres Stylos</span>
      </div>
      <div class="brand-actions">
        <button type="button" class="syncbtn" id="sync-btn">
          <span class="sync-dot off" id="sync-dot" aria-hidden="true"></span>
          <span id="sync-txt">Excel · Sin conectar</span>
        </button>
        <button type="button" class="syncbtn logout-btn" id="logout-btn" hidden>Salir</button>
      </div>
    </header>

    <div class="tabs lg-panel" role="tablist" data-lg="bar" data-app hidden>
      <button role="tab" id="t-hoy" aria-selected="true">Hoy</button>
      <button role="tab" id="t-cli" aria-selected="false">Clientes</button>
      <button role="tab" id="t-res" aria-selected="false">Resumen</button>
    </div>

    <!-- Vista: Hoy -->
    <div class="card lg-panel" data-view="hoy" data-lg="card" hidden>
      <label>Cliente</label>
      <div id="selbox" class="sel" hidden>
        <div class="m">
          <div class="n" id="seln"></div>
          <div class="s" id="selt"></div>
        </div>
        <button class="del" id="chg">Cambiar</button>
      </div>
      <div id="finder">
        <input id="cs" autocomplete="off" placeholder="Buscar... o agregar nuevo">
        <div id="res"></div>
        <button class="sec wide" id="newc">+ Cliente nuevo</button>
      </div>
    </div>

    <div class="card lg-panel" data-view="hoy" data-lg="card" hidden>
      <div class="f">
        <label>Corte</label>
        <div class="chips" id="chips"></div>
        <input id="cut" placeholder="Otro corte (escribilo)">
      </div>
      <div class="f f-price">
        <label for="price">Precio (opcional)</label>
        <input id="price" type="number" inputmode="numeric" min="0" placeholder="$ 0">
        <div class="pr">
          <button class="ten" data-p="set10">$10.000</button>
          <button data-p="add">+ $1.000</button>
          <button data-p="sub">− $1.000</button>
          <button data-p="clr">Borrar</button>
        </div>
      </div>
      <div class="f">
        <label>Forma de pago</label>
        <div class="pay" id="pay">
          <button data-m="efectivo" aria-pressed="true">Efectivo</button>
          <button data-m="transferencia" aria-pressed="false">Transferencia</button>
        </div>
      </div>
      <p class="err" id="err"></p>
      <button class="save" id="save">Guardar corte</button>
    </div>

    <label class="section-label" data-view="hoy" hidden>Último corte</label>
    <div class="card lg-panel" data-view="hoy" data-lg="card" hidden>
      <div id="list"></div>
    </div>

    <!-- Vista: Clientes -->
    <div class="card lg-panel" data-view="cli" data-lg="card" hidden>
      <input id="q" placeholder="Buscar... o agregar nuevo">
      <button class="sec wide" id="newc2">+ Cliente nuevo</button>
    </div>
    <div class="card lg-panel" data-view="cli" data-lg="card" hidden>
      <div id="clist"></div>
    </div>

    <!-- Vista: Resumen -->
    <div class="rng lg-panel" id="rng" data-view="res" data-lg="bar" hidden>
      <button data-r="hoy" aria-pressed="true">Hoy</button>
      <button data-r="sem" aria-pressed="false">Semana</button>
      <button data-r="mes" aria-pressed="false">Mes</button>
      <button data-r="todo" aria-pressed="false">Todo</button>
    </div>
    <div class="mnav" id="mnav" data-view="res" hidden>
      <button id="mprev" aria-label="Mes anterior">‹</button>
      <b id="mname"></b>
      <button id="mnext" aria-label="Mes siguiente">›</button>
    </div>
    <div class="eyebar" data-view="res" hidden>
      <button class="eyeb" data-eye aria-label="Ocultar importes"></button>
    </div>
    <div class="stat lg-panel col-l" data-view="res" data-lg="stat" hidden><div class="k">Cortes</div><div class="v" id="s-n">0</div></div>
    <div class="stat lg-panel col-r" data-view="res" data-lg="stat" hidden><div class="k">Total</div><div class="v" id="s-t"></div></div>
    <div class="stat lg-panel col-l" data-view="res" data-lg="stat" hidden><div class="k">Transferencias</div><div class="v" id="s-tr">0</div></div>
    <div class="stat lg-panel col-r" data-view="res" data-lg="stat" hidden><div class="k">Efectivo</div><div class="v" id="s-ef">0</div></div>
    <p id="s-nd" data-view="res" hidden></p>
    <label class="hist-label" data-view="res" hidden>Historial</label>

    <!-- Modal: Cliente nuevo / Editar cliente (con LiquidGlass) -->
    <div class="ov-bg" id="ov-bg" hidden></div>
    <div class="card lg-panel modal-card" id="ov" data-lg="modal" hidden>
      <div class="modal-body">
        <h2 id="ovt">Cliente nuevo</h2>
        <div class="two">
          <div class="f"><label for="fn">Nombre</label><input id="fn" autocomplete="off"></div>
          <div class="f"><label for="fa">Apellido</label><input id="fa" autocomplete="off"></div>
        </div>
        <div class="f"><label for="fk">Apodo</label><input id="fk" autocomplete="off"></div>
        <div class="f"><label for="ft">Teléfono o DNI (opcional)</label><input id="ft" type="tel" inputmode="tel" autocomplete="off"></div>
        <p class="err" id="ferr"></p>
        <button class="save" id="fsave">Guardar cliente</button>
        <button class="sec wide" id="fcancel">Cancelar</button>
      </div>
    </div>

    <!-- Modal: Configuración Google Sheets (con LiquidGlass) -->
    <div class="ov-bg" id="ov-sheets-bg" hidden></div>
    <div class="card lg-panel modal-card" id="ov-sheets" data-lg="modal" hidden>
      <div class="modal-body">
        <h2>Base de datos · Excel</h2>
        <p class="hint" id="sh-mode">Conectando con el servidor…</p>
        <button class="save" id="sh-sync-btn" hidden>Sincronizar ahora</button>
        <button class="sec wide" id="sh-push-btn" hidden>Subir datos locales a Excel</button>
        <div class="f" style="margin-top:16px">
          <label for="sh-url">URL manual de Apps Script (opcional)</label>
          <input id="sh-url" type="url" autocomplete="off" placeholder="https://script.google.com/macros/s/.../exec">
        </div>
        <div class="f">
          <label for="sh-tok">Clave secreta manual (opcional)</label>
          <input id="sh-tok" type="password" autocomplete="off" placeholder="Dejar vacío si usás /api/sheets">
        </div>
        <p class="err" id="sh-err"></p>
        <button class="sec wide" id="sh-save">Guardar URL manual</button>
        <button class="del wide" id="sh-disc-btn" hidden>Quitar URL manual</button>
        <button class="sec wide" id="sh-cancel">Cerrar</button>
      </div>
    </div>
  </main>

  <div class="toast" id="toast">Guardado ✓</div>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/sheets.js"></script>
  <script src="js/hoy.js"></script>
  <script src="js/clientes.js"></script>
  <script src="js/resumen.js"></script>
  <script src="js/app.js"></script>
  <script type="module" src="js/liquid-glass.js"></script>
</body>
</html>
